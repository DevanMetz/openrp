name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    env:
      WRANGLER_SEND_METRICS: 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
